name: CMake

on:
  push:
    branches: [ master ]
    paths:
      - 'python/setup.py'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_ubuntu_latest:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:    
        submodules: true
    
    - name: Create Dir build_python
      run: mkdir build_python
      
    - name: Configure CMake      
      working-directory: ./build_python
      run: cmake -DCMAKE_CXX_FLAGS="-include cstdio" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ../python

    - name: Make
      working-directory: ./build_python    
      run: make
      
    - name: Make Install
      working-directory: ./build_python
      run: make install
    
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v7
      with:
        name: binary_ubuntu
        path: ./install

  build_ubuntu_latest_arm:
      runs-on: ubuntu-22.04-arm

      steps:
      - uses: actions/checkout@v7
        with:    
          submodules: true
      
      - name: Create Dir build_python
        run: mkdir build_python
        
      - name: Configure CMake      
        working-directory: ./build_python
        run: cmake -DCMAKE_CXX_FLAGS="-include cstdio" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ../python

      - name: Make
        working-directory: ./build_python    
        run: make
        
      - name: Make Install
        working-directory: ./build_python
        run: make install
      
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: binary_ubuntu_arm
          path: ./install

  build_windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:    
          submodules: true
          
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Create Dir build_python
        run: mkdir build_python
        
      - name: Configure CMake      
        working-directory: ./build_python
        run: cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ../python
        
      - name: Make
        working-directory: ./build_python    
        run: nmake

      - name: Make Install
        working-directory: ./build_python
        run: nmake install        
        
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: binary_windows
          path: ./install
      
  build_wheel:
    needs: [build_ubuntu_latest,build_ubuntu_latest_arm,build_windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Download binary_ubuntu
        uses: actions/download-artifact@v7
        with:
          name: binary_ubuntu

      - name: Inspect staged binaries
        run: |
          find . -name '*.so' -o -name '*.dll'
          file ./test_python/ThrustRTC/libPyThrustRTC.so

      - name: Download binary_ubuntu
        uses: actions/download-artifact@v7
        with:
          name: binary_ubuntu_arm

      - name: Inspect staged binaries
        run: |
          find . -name '*.so' -o -name '*.dll'
          file ./test_python/ThrustRTC/libPyThrustRTC.so

      - name: Download binary_windows
        uses: actions/download-artifact@v7
        with:
          name: binary_windows          

      - name: Set up Python 3.8
        uses: actions/setup-python@v6
        with:
            python-version: '3.8'

      - name: Install dependencies
        run: pip install setuptools wheel    
       
      - name: run setup.py
        working-directory: ./test_python
        run: python setup.py bdist_wheel
        
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: ./test_python/dist/*.whl
